name: Validate MINHO11
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      # Public checkout: no workbook, so the build uses the committed snapshot (no names).
      - run: npm run build
      - run: npm test
      - name: Built site contains no private data
        run: |
          test ! -e dist/data/internal && ! ls dist/**/*.xlsx 2>/dev/null
          node -e "const d=require('./dist/data/competition.json'); if (d.publication.scorerNames!=='redacted') process.exit(1)"
